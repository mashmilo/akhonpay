name = "akhonpay"
main = "src/index.js"
compatibility_date = "2025-06-01"

[[d1_databases]]
binding = "DB"
database_name = "akhonpay"
database_id = "1490cf2d-4620-4886-bcf5-910b13cb5937"

[triggers]
crons = ["* * * * *"]   # expires sessions + retries failed webhooks

[vars]
BKASH_NUMBER  = "01XXXXXXXXX"
NAGAD_NUMBER  = "01XXXXXXXXX"
ROCKET_NUMBER = "01XXXXXXXXX"
SESSION_TTL_MIN = "10"

# Secrets (never commit): wrangler secret put DEVICE_API_KEY / DEVICE_SECRET
