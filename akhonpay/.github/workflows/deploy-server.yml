name: Deploy server (Cloudflare Workers)

# Free: Cloudflare Workers + D1 free tier. Runs the local test suite first, then deploys.
# Needs repo secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers"), CLOUDFLARE_ACCOUNT_ID
on:
  push:
    branches: [main]
    paths: ['server/**', 'tests/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: End-to-end tests (local, no network)
        run: node tests/run-local.mjs
      - name: Deploy
        working-directory: server
        run: npm install && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
