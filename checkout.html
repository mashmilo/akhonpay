<style>
  :root {
    --navy:#0d2159; --cyan:#00d4ff;
    --accent:#0d2159;            /* replaced by the provider colour once the session loads */
    --ink:#101a3a; --muted:#566078; --line:#d8deea; --bg:#eaf0f8; --card:#fff; --soft:#f3f6fb;
    --font:"Hind Siliguri", system-ui, -apple-system, "Segoe UI", sans-serif; --ok:#12733a; --ok-bg:#e4f5ea; --err:#b3261e; --err-bg:#fdeceb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e8edf8; --muted:#9aa6c0; --line:#26335f; --bg:#07102b; --card:#0d1838; --soft:#111f47;
            --ok:#5fd68a; --ok-bg:#0f2a1b; --err:#ff8a80; --err-bg:#341512; }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px 16px 28px;
         background:var(--bg); color:var(--ink); font:400 16px/1.55 var(--font); }

  .top { width:100%; max-width:460px; display:flex; align-items:center; gap:10px; padding:4px 4px 14px; }
  .top img { width:34px; height:34px; display:block; }
  .top b { font-size:19px; font-weight:700; letter-spacing:-.01em; }
  .lang { margin-left:auto; display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--card); }
  .lang button { border:0; background:transparent; color:var(--muted); font:500 13px/1 var(--font); padding:7px 12px; cursor:pointer; border-radius:0; }
  .lang button[aria-pressed="true"] { background:var(--navy); color:#fff; }
  @media (prefers-color-scheme: dark) { .lang button[aria-pressed="true"] { background:var(--cyan); color:#06102e; } }

  main { width:100%; max-width:460px; background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden;
         box-shadow:0 1px 2px rgba(13,33,89,.06), 0 8px 28px rgba(13,33,89,.07); }
  .pad { padding:24px 22px 22px; }

  .head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .chip { display:inline-flex; align-items:center; gap:7px; padding:3px 12px 3px 9px; border-radius:999px; background:var(--accent); color:#fff;
          font-weight:600; font-size:14px; }
  .chip::before { content:""; width:7px; height:7px; border-radius:50%; background:#fff; opacity:.85; }
  .timer { color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .timer.low { color:var(--err); font-weight:600; }
  .bar { height:3px; background:var(--line); }
  .bar i { display:block; height:100%; width:100%; background:var(--accent); transform-origin:left; }

  .amt { margin:18px 0 0; font-size:44px; line-height:1.1; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .meta { margin:4px 0 0; color:var(--muted); font-size:15px; overflow-wrap:anywhere; }

  ol { margin:22px 0 0; padding:0; list-style:none; counter-reset:s; }
  li { position:relative; padding:0 0 18px 40px; counter-increment:s; }
  li:last-child { padding-bottom:0; }
  li::before { content:counter(s); position:absolute; left:0; top:1px; width:27px; height:27px; border-radius:50%;
               background:var(--soft); border:1.5px solid var(--accent); color:var(--accent); font-weight:700; font-size:14px;
               display:grid; place-items:center; }
  @media (prefers-color-scheme: dark) { li::before { color:var(--ink); } }
  li::after { content:""; position:absolute; left:13px; top:32px; bottom:6px; width:1.5px; background:var(--line); }
  li:last-child::after { display:none; }

  .num { display:flex; gap:10px; align-items:center; margin-top:8px; padding:10px 10px 10px 14px; background:var(--soft);
         border:1px dashed var(--line); border-radius:12px; }
  .num output { flex:1; font:700 23px/1.1 var(--font); letter-spacing:.04em; font-variant-numeric:tabular-nums; }
  button { font:inherit; cursor:pointer; }
  .copy { border:1.5px solid var(--accent); background:var(--card); color:var(--accent); border-radius:10px; padding:5px 14px; font-weight:600; font-size:14px; min-width:74px; }
  @media (prefers-color-scheme: dark) { .copy { color:var(--ink); } }
  .primary { width:100%; margin-top:20px; padding:13px; border:0; border-radius:12px; background:var(--accent); color:#fff; font-weight:700; font-size:17px; }
  .primary:disabled { opacity:.65; cursor:default; }
  .primary:not(:disabled):active { transform:translateY(1px); }

  label { display:block; }
  input { width:100%; margin-top:8px; padding:12px 13px; font:700 19px/1.3 var(--font); text-transform:uppercase; letter-spacing:.07em;
          background:var(--card); color:var(--ink); border:1.5px solid var(--line); border-radius:12px; }
  input::placeholder { color:var(--muted); opacity:.6; font-weight:500; letter-spacing:.04em; }
  input:focus, button:focus-visible, a:focus-visible { outline:3px solid color-mix(in srgb, var(--accent) 38%, transparent); outline-offset:2px; border-color:var(--accent); }
  .hint { margin:6px 0 0; color:var(--muted); font-size:13.5px; }

  #msg { min-height:26px; margin:12px 0 0; padding:0; font-weight:600; font-size:15px; border-radius:10px; }
  #msg.err { color:var(--err); background:var(--err-bg); padding:8px 12px; }
  #msg.ok  { color:var(--ok);  background:var(--ok-bg);  padding:8px 12px; }
  #msg.wait { color:var(--muted); }

  .end { text-align:center; padding:34px 22px 30px; }
  .end h1 { margin:14px 0 6px; font-size:26px; line-height:1.2; }
  .end p { margin:0; color:var(--muted); }
  .end a { display:inline-block; margin-top:16px; padding:11px 22px; border-radius:12px; background:var(--accent); color:#fff; font-weight:700; text-decoration:none; }
  .badge { width:64px; height:64px; margin:0 auto; border-radius:50%; display:grid; place-items:center; }
  .badge svg { width:34px; height:34px; fill:none; stroke:currentColor; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; }
  .badge.ok { background:var(--ok-bg); color:var(--ok); }
  .badge.no { background:var(--err-bg); color:var(--err); }
  .badge.ok path { stroke-dasharray:30; stroke-dashoffset:30; animation:draw .5s .1s ease forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }

  .skeleton { padding:28px 22px; color:var(--muted); text-align:center; }
  .foot { width:100%; max-width:460px; margin-top:14px; text-align:center; color:var(--muted); font-size:13px; }
  .hide { display:none !important; }
  @media (prefers-reduced-motion: reduce) { .badge.ok path { animation:none; stroke-dashoffset:0; } * { transition:none !important; } }
</style>
</head>

          <input id="trx" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="20" inputmode="text" enterkeyhint="go" placeholder="BLA12C34D5">
          <p class="hint" data-t="hint"></p>
        </li>
      </ol>
      <button class="primary" id="verify" type="button" data-t="verify">Verify payment</button>
      <p id="msg" role="status" aria-live="polite"></p>
    </div>
  </section>

  <section id="end" class="end hide">
    <div class="badge" id="badge"></div>
    <h1 id="endTitle"></h1>
    <p id="endText"></p>
    <a id="endLink" class="hide" href="#" data-t="continue">Back to the store</a>
  </section>
</main>
<p class="foot" data-t="foot">Secured by Akhonpay · Never share your PIN or OTP</p>

<script>
(function () {
  'use strict';
  var sid = location.pathname.split('/').pop();
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- text (English / বাংলা). **x** = bold, {x} = value ---------- */
  var T = {
    en: {
      loading: 'Loading payment…', copy: 'Copy', copied: 'Copied', verify: 'Verify payment', verifying: 'Checking…',
      step1: 'Open the {app} app and choose **Send Money**.',
      step2: 'Send exactly **{amount}** to this number.',
      step3: 'Enter the Transaction ID (TrxID) from the confirmation SMS.',
      hint: 'Use the SMS from {app} after you send the money, not an older one.',
      order: 'Order {order}', expires: 'Expires in {t}',
      checking: 'Checking payment…', waiting: 'Waiting for the payment to arrive… ({n}/{m})',
      badFormat: 'Enter the TrxID exactly as shown in the SMS (letters and digits only).',
      notFound: 'No payment found for this TrxID and amount. Check both, then verify again.',
      tooMany: 'Too many attempts. Contact the store with your TrxID.',
      generic: 'Something went wrong. Try again.', network: 'Network problem. Check your connection and try again.',
      okTitle: 'Payment received', okBack: 'Taking you back to the store…', okClose: 'You can close this page.',
      expTitle: 'This payment has expired', expText: 'Go back to the store and place the order again. If you already paid, contact the store with your TrxID.',
      expText2: 'Go back to the store and place the order again.',
      paidTitle: 'Order already paid', paidText: 'This order has already been paid.',
      badTitle: 'Link not valid', badText: 'Check the link or start the payment again from the store.',
      failTitle: 'Could not load payment', failText: 'Refresh the page to try again.',
      continue: 'Back to the store', foot: 'Secured by Akhonpay · Never share your PIN or OTP'
    },
    bn: {
      loading: 'পেমেন্ট লোড হচ্ছে…', copy: 'কপি', copied: 'কপি হয়েছে', verify: 'পেমেন্ট যাচাই করুন', verifying: 'যাচাই হচ্ছে…',
      step1: '{app} অ্যাপ খুলে **Send Money** বেছে নিন।',
      step2: 'এই নম্বরে ঠিক **{amount}** পাঠান।',
      step3: 'কনফার্মেশন SMS-এ থাকা ট্রানজ্যাকশন আইডি (TrxID) লিখুন।',
      hint: 'টাকা পাঠানোর পরে {app} থেকে আসা নতুন SMS-এর TrxID দিন, পুরনোটি নয়।',
      order: 'অর্ডার {order}', expires: 'মেয়াদ শেষ হতে {t}',
      checking: 'পেমেন্ট যাচাই হচ্ছে…', waiting: 'পেমেন্টের অপেক্ষা করা হচ্ছে… ({n}/{m})',
      badFormat: 'SMS-এ যেমন আছে ঠিক তেমন TrxID লিখুন (শুধু ইংরেজি অক্ষর ও সংখ্যা)।',
      notFound: 'এই TrxID ও পরিমাণের কোনো পেমেন্ট পাওয়া যায়নি। দুটোই আবার দেখে যাচাই করুন।',
      tooMany: 'অনেকবার চেষ্টা করা হয়েছে। আপনার TrxID সহ দোকানের সাথে যোগাযোগ করুন।',
      generic: 'কিছু একটা সমস্যা হয়েছে। আবার চেষ্টা করুন।', network: 'নেটওয়ার্ক সমস্যা। সংযোগ দেখে আবার চেষ্টা করুন।',
      okTitle: 'পেমেন্ট পাওয়া গেছে', okBack: 'আপনাকে দোকানে ফিরিয়ে নেওয়া হচ্ছে…', okClose: 'আপনি এই পেজ বন্ধ করতে পারেন।',
      expTitle: 'এই পেমেন্টের মেয়াদ শেষ', expText: 'দোকানে ফিরে আবার অর্ডার করুন। টাকা পাঠিয়ে থাকলে TrxID সহ দোকানের সাথে যোগাযোগ করুন।',
      expText2: 'দোকানে ফিরে আবার অর্ডার করুন।',
      paidTitle: 'অর্ডারের টাকা পরিশোধ হয়ে গেছে', paidText: 'এই অর্ডারের পেমেন্ট আগেই সম্পন্ন হয়েছে।',
      badTitle: 'লিংকটি সঠিক নয়', badText: 'লিংক দেখে নিন, অথবা দোকান থেকে আবার পেমেন্ট শুরু করুন।',
      failTitle: 'পেমেন্ট লোড করা যায়নি', failText: 'পেজ রিফ্রেশ করে আবার চেষ্টা করুন।',
      continue: 'দোকানে ফিরে যান', foot: 'Akhonpay দ্বারা সুরক্ষিত · PIN বা OTP কাউকে দেবেন না'
    }
  };
  var lang = 'en';
  try { var saved = localStorage.getItem('akhonpay_lang'); if (saved === 'bn' || saved === 'en') lang = saved; else if (/^bn/i.test(navigator.language || '')) lang = 'bn'; } catch (e) {}

  var S = null;                 // session info
  var skew = 0, expiresAt = 0, startedAt = 0, tick = 0, busy = false, ended = null, lastMsg = null, redirectTimer = 0;

  /* Build text from a template without innerHTML: values are always inserted as text. */
  function fill(el, tpl, vars) {
    el.textContent = '';
    String(tpl).split(/(\*\*[^*]+\*\*|\{\w+\})/).forEach(function (p) {
      if (!p) return;
      var m;
      if ((m = p.match(/^\*\*(.+)\*\*$/))) { var b = document.createElement('b'); b.textContent = sub(m[1], vars); el.appendChild(b); }
      else el.appendChild(document.createTextNode(sub(p, vars)));
    });
  }
  function sub(s, vars) { return s.replace(/\{(\w+)\}/g, function (_, k) { return vars && vars[k] != null ? vars[k] : ''; }); }
  function tr(key, vars) { return sub(T[lang][key] || T.en[key] || key, vars); }
  function vars() { return S ? { app: S.provider_label, amount: '৳' + S.amount, order: S.order_id } : {}; }

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(function (el) { fill(el, T[lang][el.getAttribute('data-t')], vars()); });
    document.querySelectorAll('.lang button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang)); });
    if (S) { fill($('order'), T[lang].order, vars()); countdown(); }
    if (ended) renderEnd(ended);
    if (lastMsg) msg(lastMsg.key, lastMsg.cls, lastMsg.v);
  }

  function show(id) { ['loading', 'pay', 'end'].forEach(function (x) { $(x).classList.toggle('hide', x !== id); }); }
  function msg(key, cls, v) {
    lastMsg = key ? { key: key, cls: cls, v: v } : null;
    $('msg').textContent = key ? tr(key, v) : ''; $('msg').className = cls || '';
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  /* ---------- end states ---------- */
  var ICON_OK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var ICON_NO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v6M12 17h.01"/></svg>';
  function end(state) { clearInterval(tick); ended = state; renderEnd(state); show('end'); }
  function renderEnd(e) {
    var ok = e.kind === 'ok';
    $('badge').className = 'badge ' + (ok ? 'ok' : 'no');
    $('badge').innerHTML = ok ? ICON_OK : ICON_NO;          // static trusted SVG only
    $('endTitle').textContent = tr(e.title);
    $('endText').textContent = tr(e.text);
    var a = $('endLink');
    if (e.url) { a.href = e.url; a.classList.remove('hide'); } else { a.classList.add('hide'); }
  }
  function success(url) {
    end({ kind: 'ok', title: 'okTitle', text: url ? 'okBack' : 'okClose', url: url || null });
    if (url) redirectTimer = setTimeout(function () { location.href = url; }, 2200);
  }
  var EXPIRED = { kind: 'no', title: 'expTitle', text: 'expText' };

  /* ---------- countdown ---------- */
  function countdown() {
    if (!S || ended) return;
    var now = Date.now() + skew, left = Math.max(0, Math.floor((expiresAt - now) / 1000));
    var t = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
    $('timer').textContent = tr('expires', { t: t });
    $('timer').classList.toggle('low', left <= 60);
    var total = Math.max(1, expiresAt - startedAt);
    $('barfill').style.transform = 'scaleX(' + Math.max(0, Math.min(1, (expiresAt - now) / total)) + ')';
    if (left === 0) end(EXPIRED);
  }

  /* ---------- load ---------- */
  async function load() {
    var r = await fetch('/api/v1/session/' + sid, { cache: 'no-store' });
    if (!r.ok) return end({ kind: 'no', title: 'badTitle', text: 'badText' });
    var s = await r.json();
    if (s.status === 'paid') return success(s.return_url);
    if (s.status !== 'pending') return end({ kind: 'no', title: 'expTitle', text: 'expText2' });

    S = s;
    document.documentElement.style.setProperty('--accent', s.color);
    document.title = 'Akhonpay – Pay ৳' + s.amount + ' with ' + s.provider_label;
    $('chip').textContent = s.provider_label;
    $('amount').textContent = '৳' + s.amount;
    $('wallet').textContent = s.wallet_number;
    skew = s.server_now - Date.now(); expiresAt = s.expires_at;
    startedAt = Math.min(Date.now() + skew, expiresAt - 1);
    startedAt = Math.max(startedAt, expiresAt - 10 * 60 * 1000);   // bar assumes the default 10 min window
    applyLang();
    tick = setInterval(countdown, 1000);
    show('pay');
  }

  /* ---------- copy ---------- */
  $('copy').onclick = function () {
    var n = $('wallet').textContent, btn = $('copy');
    function done() { btn.textContent = tr('copied'); setTimeout(function () { btn.textContent = tr('copy'); }, 1600); }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(n).then(done, fallback); else fallback();
    function fallback() {
      var r = document.createRange(); r.selectNodeContents($('wallet')); var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      try { document.execCommand('copy'); done(); } catch (e) {} sel.removeAllRanges();
    }
  };

  /* ---------- verify ---------- */
  async function verify() {
    if (busy || ended) return;
    var trx = $('trx').value.trim().toUpperCase();
    if (!/^[A-Z0-9]{6,20}$/.test(trx)) return msg('badFormat', 'err');
    busy = true; $('verify').disabled = true; $('verify').textContent = tr('verifying');
    var TRIES = 5;
    try {
      // The SMS can reach the gateway a few seconds after the customer pays, so retry briefly before giving up.
      for (var i = 0; i < TRIES; i++) {
        if (i === 0) msg('checking', 'wait'); else msg('waiting', 'wait', { n: i, m: TRIES - 1 });
        var r = await fetch('/api/v1/session/' + sid + '/verify', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ trx_id: trx }) });
        var d = await r.json().catch(function () { return {}; });
        if (d.status === 'paid') return success(d.return_url);
        if (d.status === 'expired') return end(EXPIRED);
        if (d.status === 'too_many_attempts') return msg('tooMany', 'err');
        if (d.status === 'order_already_paid') return end({ kind: 'no', title: 'paidTitle', text: 'paidText' });
        if (d.status === 'invalid_format') return msg('badFormat', 'err');
        if (d.status !== 'not_found') return msg('generic', 'err');
        if (i < TRIES - 1) await sleep(6000);
      }
      msg('notFound', 'err');
    } catch (e) {
      msg('network', 'err');
    } finally { busy = false; $('verify').disabled = false; $('verify').textContent = tr('verify'); }
  }
  $('verify').onclick = verify;
  $('trx').addEventListener('keydown', function (e) { if (e.key === 'Enter') verify(); });
  $('trx').addEventListener('input', function () { if (lastMsg && lastMsg.cls === 'err') msg(null); });

  document.querySelectorAll('.lang button').forEach(function (b) {
    b.onclick = function () { lang = b.getAttribute('data-lang'); try { localStorage.setItem('akhonpay_lang', lang); } catch (e) {} applyLang(); };
  });

  applyLang();
  load().catch(function () { end({ kind: 'no', title: 'failTitle', text: 'failText' }); });
})();
</script>
</body>
</html>
