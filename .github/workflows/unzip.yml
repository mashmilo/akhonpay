name: unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Found zip: $ZIP_FILE"
          unzip -o "$ZIP_FILE"
          EXTRACTED_DIR=$(unzip -qql "$ZIP_FILE" | head -n1 | awk '{print $4}' | cut -d/ -f1)
          echo "Extracted folder: $EXTRACTED_DIR"
          cp -a "$EXTRACTED_DIR"/. .
          rm -rf "$EXTRACTED_DIR" "$ZIP_FILE"
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Unpack zip archive automatically"
          git push
